<header class="w-full p-4 md:p-6 px-4 md:px-8 flex justify-between items-center rounded-2xl shadow-lg border border-gray-200
        fixed top-4 left-4 right-4 z-50 mid:relative mid:mt-6 mid:left-auto mid:right-auto mid:z-10"
        style="background: linear-gradient(90deg, rgba(30,64,175,0.5) 0%, rgba(255,255,255,0.5) 60%);">
  <div class="text-sm md:text-base font-semibold text-white md:text-left">
    {{ todayDate | date:'dd MMMM yyyy HH:mm' }}
  </div>

  <div class="flex items-center gap-2">
    <!-- Home Button (Redirects to dashboard) -->
    @if (showHomeButton) {
      <a routerLink="/home"
         class="bg-white rounded-lg w-12 h-12 flex items-center justify-center shadow-sm hover:bg-gray-50 transition-colors"
         title="Retour au tableau de bord"
         aria-label="Retour au tableau de bord">
        <mat-icon class="text-gray-700">house</mat-icon>
      </a>
    }

    <!-- Mobile hamburger trigger (square with rounded edges, larger) -->
    <button class="mid:hidden bg-white rounded-lg w-12 h-12 flex flex-col items-center justify-center gap-1 p-2 shadow-sm hover:bg-gray-50 focus:outline-none" title="Menu" (click)="toggleNav()" aria-label="Open menu">
      <span class="block w-full h-0.5 bg-gray-700 rounded"></span>
      <span class="block w-full h-0.5 bg-gray-700 rounded"></span>
      <span class="block w-full h-0.5 bg-gray-700 rounded"></span>
    </button>
  </div>
</header>

<!-- Spacer shown only on small screens to offset fixed header so page content is not hidden beneath it -->
<div class="mid:hidden h-20"></div>

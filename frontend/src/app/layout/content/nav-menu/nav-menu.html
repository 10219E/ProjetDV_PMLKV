<div>
  <!-- Mobile overlay: shown when visible on small screens -->
  @if (visible && !preventMobileOverlay) {
    <!-- mobile overlay: will be moved to document.body at runtime so it escapes any stacking-context and always sits above the floating header -->
    <!-- Smooth transitions: overlay fades, panel slides in from the right -->
    <div class="fixed inset-0 nav-mobile-overlay flex mid:hidden justify-end transition-opacity duration-200" style="z-index:99999;" [class.opacity-100]="visible" [class.opacity-0]="!visible">
      <!-- backdrop kept transparent so page is not darkened during transitions -->
      <div class="absolute inset-0 bg-transparent transition-opacity duration-200" (click)="close()" aria-hidden="true" [class.opacity-100]="visible" [class.opacity-0]="!visible"></div>
      <div class="relative nav-mobile-panel w-72 bg-white/95 backdrop-blur-sm p-6 border-l border-gray-200 transform transition-transform duration-200" [class.translate-x-0]="visible" [class.translate-x-full]="!visible">
        <button class="absolute top-3 right-3 text-gray-600" (click)="close()">✕</button>
        <nav class="flex flex-col gap-6 text-lg">
          <a routerLink="#" class="hover:text-blue-600 flex font-bold items-center gap-3">👤 MON PROFIL</a>
          <a routerLink="#" class="hover:text-blue-600 flex font-bold items-center gap-3">🏓 MES MATCHS</a>
          <a routerLink="#" class="hover:text-blue-600 flex font-bold items-center gap-3">✉️ MES INVITATIONS</a>
          <a routerLink="#" class="hover:text-blue-600 flex font-bold items-center gap-3">➕ MATCH PUBLIC</a>
          <a href="#" (click)="$event.preventDefault(); goCreatePmatch()" class="hover:text-blue-600 flex font-bold items-center gap-3">⭐ Créer Match Privé</a>
          <a routerLink="#" class="hover:text-blue-600 flex font-bold items-center gap-3">🛠️ REGLAGES</a>
          <button (click)="onLogout()" class="mt-4 text-left hover:text-red-500 flex font-bold items-center gap-3 p-1">⏻ SE DECONNECTER</button>
        </nav>
      </div>
    </div>
  }

  <!-- Desktop aside: always present on mid+ -->
  <aside class="hidden mid:flex flex-col w-72 bg-white/50 backdrop-blur-sm rounded-2xl shadow-lg border border-gray-200 p-6 flex-shrink-0 self-start mt-6 mr-2 mid:mr-6 z-20 mb-8 font-bold min-h-[70vh]">
    <nav class="flex flex-col gap-6 text-lg">
      <a routerLink="#" class="hover:text-blue-600 flex items-center gap-3">👤 Mon Profil</a>
      <a routerLink="#" class="hover:text-blue-600 flex items-center gap-3">🏓 Mes Matchs</a>
      <a routerLink="#" class="hover:text-blue-600 flex items-center gap-3">✉️ Mes Invitations</a>
      <a routerLink="#" class="hover:text-blue-600 flex items-center gap-3">➕ Rejoindre Match Public</a>
      <a href="#" (click)="$event.preventDefault(); goCreatePmatch()" class="hover:text-blue-600 flex items-center gap-3">⭐ Créer Match Privé</a>
      <a routerLink="#" class="hover:text-blue-600 flex items-center gap-3">🛠️ Reglages</a>
      <button (click)="onLogout()" class="hover:text-red-500 flex items-center gap-3 p-1">⏻ Se Déconnecter</button>
    </nav>
  </aside>
</div>

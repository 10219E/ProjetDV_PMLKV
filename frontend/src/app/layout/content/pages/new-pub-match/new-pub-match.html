<app-home-account-header></app-home-account-header>

<div class="flex flex-1 flex-col mid:flex-row relative p-8">
  <main class="flex-1 p-6 relative flex flex-col items-stretch z-10">
	<div class="w-full max-w-full mb-6">
	  <h1 class="text-2xl font-bold">Nouveau match public</h1>
	  <p class="text-sm text-gray-600 mt-2">Remplissez les informations ci-dessous pour créer un match public.</p>
	</div>

	<div class="max-w-3xl mx-auto">
	  <app-match-form [defaultType]="'public'" [hideOrganiser]="true" [hideInvites]="true" [stayOnPageAfterSuccess]="true"></app-match-form>
	</div>
  </main>

  <!-- Page-level NavMenu placed here so desktop aside aligns to the right -->
  <app-nav-menu></app-nav-menu>
</div>

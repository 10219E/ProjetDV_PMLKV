<div class="max-w-xl mx-auto">
  <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white p-6 rounded shadow">
	<h2 class="text-xl font-bold mb-4">Create Match</h2>

	<div class="mb-3">
	  <label class="block text-sm font-medium">Field</label>
			  <select formControlName="fieldId" class="w-full border rounded p-2">
				<option value="">-- Select field --</option>
				@for (f of fields; track f.fieldId) {
				  <option [value]="f.fieldId">{{f.fieldId}} - {{f.siteId}}</option>
				}
			  </select>
	</div>

	<div class="mb-3">
	  <label class="block text-sm font-medium">Type</label>
	  <select formControlName="type" [disabled]="!!defaultType" class="w-full border rounded p-2">
		<option value="">-- Select --</option>
		<option value="private">Private</option>
		<option value="public">Public</option>
	  </select>
	</div>

	<div class="mb-3">
	  <label class="block text-sm font-medium">Pub Status</label>
	  <input formControlName="pubStatus" class="w-full border rounded p-2" placeholder="open/closed/completed" />
	</div>

	<div class="mb-3">
	  <label class="block text-sm font-medium">Priv Status</label>
	  <input formControlName="privStatus" class="w-full border rounded p-2" placeholder="awaiting/confirmed/completed" />
	</div>

	<div class="grid grid-cols-3 gap-3 mb-3">
	  <div>
		<label class="block text-sm font-medium">Date</label>
		<input type="date" formControlName="matchDate" class="w-full border rounded p-2" />
	  </div>
	  <div>
		<label class="block text-sm font-medium">Start</label>
		<input type="time" formControlName="startTime" class="w-full border rounded p-2" />
	  </div>
	  <div>
		<label class="block text-sm font-medium">End</label>
		<input type="time" formControlName="endTime" class="w-full border rounded p-2" />
	  </div>
	</div>

	<div class="mb-3">
	  <label class="block text-sm font-medium">Pricing</label>
	  <input type="number" formControlName="pricing" class="w-full border rounded p-2" />
	</div>

	<div class="mb-3">
	  <label class="block text-sm font-medium">Organiser</label>
	  <input formControlName="organiserId" readonly class="w-full border rounded p-2 bg-gray-50" />
	  <div class="text-sm text-gray-600 mt-1">{{organiserName}}</div>
	</div>

	@if (isPrivate()) {
	  <div class="mb-3" formArrayName="invites">
		<label class="block text-sm font-medium mb-2">Invites (3 players)</label>
		@for (i of [0,1,2]; track i) {
		  <div class="mb-2">
			<input [formControlName]="i" placeholder="Invite matricule" class="w-full border rounded p-2" />
		  </div>
		}
	  </div>
	}

	@if (error) {
	  <div class="text-red-600 mb-2">{{error}}</div>
	}
	@if (successMessage) {
	  <div class="text-green-600 mb-2">{{successMessage}}</div>
	}

	<div class="flex justify-end">
	  <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded" [disabled]="loading">{{ loading ? 'Creating...' : 'Create Match' }}</button>
	</div>
  </form>
</div>
